<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 608" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <!-- Wireframe do painel 5: taxa de ocupacao por modelo de aeronave -->
  <!-- Valores ilustrativos; os resultados reais estao no README.md -->
  <rect x="0" y="0" width="800" height="608" fill="#F5F6F8"/>

  <text x="24" y="28" font-size="12" fill="#6B7280">Wireframe com valores ilustrativos. Resultados reais em README.md</text>
  <text x="24" y="64" font-size="22" font-weight="700" fill="#1A1A1A">Ocupação por modelo de aeronave</text>

  <!-- Filtros -->
  <g font-size="13" fill="#1A1A1A">
    <rect x="24" y="80" width="128" height="32" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
    <text x="40" y="101">Ano: 2026</text>
    <text x="136" y="101" text-anchor="end" fill="#6B7280">▾</text>
    <rect x="168" y="80" width="160" height="32" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
    <text x="184" y="101">Mês: setembro</text>
    <text x="312" y="101" text-anchor="end" fill="#6B7280">▾</text>
    <rect x="344" y="80" width="184" height="32" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
    <text x="360" y="101">Fabricante: todos</text>
    <text x="512" y="101" text-anchor="end" fill="#6B7280">▾</text>
  </g>

  <!-- Indicador principal -->
  <rect x="24" y="128" width="248" height="128" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="48" y="160" font-size="13" fill="#6B7280">Ocupação geral</text>
  <text x="48" y="212" font-size="44" font-weight="700" fill="#1F5F7A">82%</text>
  <text x="48" y="240" font-size="12" fill="#6B7280">soma passageiros ÷ soma assentos</text>

  <!-- Indicadores secundarios -->
  <rect x="288" y="128" width="232" height="128" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="312" y="160" font-size="13" fill="#6B7280">Passageiros / assentos</text>
  <text x="312" y="208" font-size="28" font-weight="700" fill="#1A1A1A">9.840 / 12.000</text>

  <rect x="536" y="128" width="240" height="128" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="560" y="160" font-size="13" fill="#6B7280">Voos no período</text>
  <text x="560" y="208" font-size="28" font-weight="700" fill="#1A1A1A">64</text>

  <!-- Grafico: top 5 modelos por ocupacao -->
  <rect x="24" y="272" width="752" height="288" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="48" y="304" font-size="15" font-weight="700" fill="#1A1A1A">Top 5 modelos por ocupação</text>

  <!-- Grade e eixo: 0% em x=160, 100% em x=640 (480 px) -->
  <g stroke="#EEF0F3" stroke-width="1">
    <line x1="280" y1="320" x2="280" y2="520"/>
    <line x1="400" y1="320" x2="400" y2="520"/>
    <line x1="520" y1="320" x2="520" y2="520"/>
    <line x1="640" y1="320" x2="640" y2="520"/>
  </g>
  <line x1="160" y1="320" x2="160" y2="520" stroke="#9CA3AF"/>
  <line x1="160" y1="520" x2="640" y2="520" stroke="#9CA3AF"/>
  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <text x="160" y="540">0%</text>
    <text x="280" y="540">25%</text>
    <text x="400" y="540">50%</text>
    <text x="520" y="540">75%</text>
    <text x="640" y="540">100%</text>
  </g>

  <!-- Barras -->
  <g fill="#1F5F7A">
    <rect x="160" y="328" width="436.8" height="24" rx="3"/>
    <rect x="160" y="368" width="412.8" height="24" rx="3"/>
    <rect x="160" y="408" width="388.8" height="24" rx="3"/>
    <rect x="160" y="448" width="369.6" height="24" rx="3"/>
    <rect x="160" y="488" width="326.4" height="24" rx="3"/>
  </g>

  <!-- Meta em 80% -->
  <line x1="544" y1="320" x2="544" y2="520" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="544" y="316" font-size="11" fill="#1A1A1A" text-anchor="middle">meta 80%</text>

  <!-- Rotulos dos modelos -->
  <g font-size="13" fill="#1A1A1A" text-anchor="end">
    <text x="144" y="345">E195-E2</text>
    <text x="144" y="385">A320neo</text>
    <text x="144" y="425">E190</text>
    <text x="144" y="465">A321neo</text>
    <text x="144" y="505">737 MAX 8</text>
  </g>

  <!-- Valor na ponta e numero de voos -->
  <g stroke="#FFFFFF" stroke-width="4" paint-order="stroke">
    <text x="605" y="345" font-size="13" font-weight="700" fill="#1A1A1A">91%</text>
    <text x="637" y="345" font-size="11" fill="#6B7280">10 voos</text>
    <text x="581" y="385" font-size="13" font-weight="700" fill="#1A1A1A">86%</text>
    <text x="613" y="385" font-size="11" fill="#6B7280">18 voos</text>
    <text x="557" y="425" font-size="13" font-weight="700" fill="#1A1A1A">81%</text>
    <text x="589" y="425" font-size="11" fill="#6B7280">8 voos</text>
    <rect x="534" y="451" width="32" height="18" fill="#FFFFFF" stroke="none"/>
    <text x="538" y="465" font-size="13" font-weight="700" fill="#1A1A1A">77%</text>
    <text x="570" y="465" font-size="11" fill="#6B7280">12 voos</text>
    <text x="494" y="505" font-size="13" font-weight="700" fill="#1A1A1A">68%</text>
    <rect x="524" y="492" width="48" height="18" fill="#FFFFFF" stroke="none"/>
    <text x="526" y="505" font-size="11" fill="#6B7280">16 voos</text>
  </g>

  <!-- Nota de interacao -->
  <text x="24" y="588" font-size="12" fill="#6B7280">Clique numa barra para o drill down do modelo para o prefixo da aeronave. Fonte: fato_voo, dim_aeronave, dim_tempo.</text>
</svg>
